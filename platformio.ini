; PlatformIO Configuration - ESPBasto Relay
; XIAO ESP32-C3 - Module Relais

[env:seeed_xiao_esp32c3]
; Version ÉPINGLÉE pour la reproductibilité. « espressif32 » nu se
; résout différemment selon la machine et la date : ce firmware pilote
; un appareil à combustion, il doit se recompiler à l'identique dans
; six mois. La version retenue est celle validée au banc le 27/07/2026.
; Le code exige un core Arduino 3.x (signatures esp_now_recv_info_t /
; wifi_tx_info_t) : ne pas rétrograder vers un espressif32 6.x, qui
; embarque le core 2.x.
platform = espressif32@55.3.35
board = seeed_xiao_esp32c3
framework = arduino

; Activer USB CDC pour Serial sur XIAO ESP32-C3
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Vitesse
upload_speed = 921600
monitor_speed = 115200

; Configuration flash
board_build.flash_mode = dio

; ---------------------------------------------------------------------
; BANC DE TEST série (jamais en production !) :
;   pio run -e seeed_xiao_esp32c3_test --target upload
; Identique au firmware normal + commandes série de test (-DTEST_CLI) :
; `mute <s>` simule une coupure de liaison ESP-NOW (test du watchdog).
; NE PAS flasher ce firmware pour l'usage réel avec le Webasto.
; ---------------------------------------------------------------------
[env:seeed_xiao_esp32c3_test]
extends = env:seeed_xiao_esp32c3
build_flags =
    ${env:seeed_xiao_esp32c3.build_flags}
    -DTEST_CLI
